site_name: Little Sweet Cafe Docs
site_description: Staff training, procedures, maintenance guides and recipes for Little Sweet Cafe, Surfers Paradise.
site_url: https://docs.littlesweetcafe.com.au/

# MkDocs can't use the repo root as docs_dir, so scripts/build-docs.sh copies
# the content folders into build/docs first. Run that script; don't run
# `mkdocs build` directly.
docs_dir: build/docs
# The style guide (site/guide/) is for writers only: kept in the repo, not published.
exclude_docs: |
  guide/
site_dir: build/site

theme:
  name: material
  language: en
  # Same logo and favicon as littlesweetcafe.com.au (copied from the Square site)
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  # Body text: DM Sans, a free stand-in for Larsseit (the Square site's body
  # font, which is a paid font). Headings use Quicksand, loaded in extra.css.
  font:
    text: DM Sans
    code: JetBrains Mono
  # Light mode only, like the Square site
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    # Navigation: tabs on top, breadcrumbs above each title, previous/next
    # links in the footer, fast page loads, back-to-top button.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    # "On this page" panel follows the reader's scroll
    - toc.follow
    # Search: suggestions while typing, highlight matches, shareable links
    - search.suggest
    - search.highlight
    - search.share
    - content.action.view

plugins:
  # Menu order and section names come from .nav.yml files (site/.nav.yml for
  # the top tabs, recipes/.nav.yml for the Recipes menu).
  - awesome-nav
  - search:
      lang: en
      # Also split words on hyphens, so "bubble-tea" finds "bubble tea"
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])'

extra_css:
  - stylesheets/extra.css

extra:
  homepage: https://littlesweetcafe.com.au/
  generator: false
  social:
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/littlesweetcafegc/
      name: Instagram @littlesweetcafegc
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/littlesweetcafegc/
      name: Facebook @littlesweetcafegc
    - icon: material/web
      link: https://littlesweetcafe.com.au/
      name: littlesweetcafe.com.au

copyright: Little Sweet Cafe · Shop 10/2 Elkhorn Ave, Surfers Paradise QLD 4217

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.superfences
